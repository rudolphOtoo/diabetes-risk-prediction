name: Render Manuscript PDF

on:
  push:
    branches: [main, master]
    paths:
      - "docs/manuscript.md"
      - ".github/workflows/manuscript.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "docs/manuscript.md"
      - ".github/workflows/manuscript.yml"
  workflow_dispatch:

jobs:
  render:
    name: Build manuscript.pdf
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pandoc and a LaTeX engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-latex-recommended

      - name: Render manuscript to PDF
        run: |
          pandoc -f markdown-yaml_metadata_block \
            docs/manuscript.md \
            -o docs/manuscript.pdf \
            --pdf-engine=xelatex \
            --variable=geometry:margin=1in \
            --variable=fontsize=11pt \
            --variable=documentclass=article \
            --metadata=lang:en \
            --highlight-style=pygments \
            --toc \
            --toc-depth=2

      - name: Upload manuscript.pdf
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: docs/manuscript.pdf

      - name: Release manuscript PDF
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: manuscript-pdf
          name: Manuscript (PDF)
          body: Auto-generated PDF build of `docs/manuscript.md` for the most recent push to `main`.
          draft: false
          prerelease: false
          files: docs/manuscript.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
