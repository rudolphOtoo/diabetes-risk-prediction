[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetes-risk-prediction"
version = "1.0.0"
description = "Reproducible machine-learning framework for diabetes risk classification (Pima Indians dataset)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rudolph Otoo" }]
keywords = ["machine-learning", "diabetes", "clinical-risk", "sklearn", "reproducible-research"]

dependencies = [
    "numpy>=1.26,<2.1",
    "pandas>=2.1,<2.3",
    "scikit-learn>=1.4,<1.7",
    "matplotlib>=3.8,<3.11",
    "seaborn>=0.13,<0.15",
    "joblib>=1.3,<1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "src"

# ── Ruff: linting & formatting configuration ───────────────────────────────
[tool.ruff]
# The runnable entry-point carries a shebang but is invoked via
# `python -m src.scripts.run_pipeline`, so it need not be OS-executable.
extend-exclude = [".venv"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
ignore = ["EXE001"]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.format]
quote-style = "double"
