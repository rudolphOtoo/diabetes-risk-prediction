# =============================================================================
# environment.yml – Conda-based reproducible environment
# =============================================================================
# Create from the repository root:
#   conda env create -f environment.yml
#   conda activate diabetes-risk-prediction
# =============================================================================
name: diabetes-risk-prediction
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.12
  - numpy>=1.26,<2.1
  - pandas>=2.1,<2.3
  - scikit-learn>=1.4,<1.7
  - matplotlib>=3.8,<3.11
  - seaborn>=0.13,<0.15
  - joblib>=1.3,<1.5
  - pip
  - pip:
      - jupyter>=1.0,<2.0
      - ipykernel>=6.28,<7.0
